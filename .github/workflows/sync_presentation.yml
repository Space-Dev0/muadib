name: Compile & Sync Presentation to Google Slides

on:
  push:
    paths:
      - 'presentation/submission.tex'
      - 'presentation/assets/**'
      - 'scripts/pdf_to_pptx.py'
      - 'scripts/upload_to_gslides.py'
      - '.github/workflows/sync_presentation.yml'
  workflow_dispatch:

concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Poppler (pdftoppm)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Cache Tectonic packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: ${{ runner.os }}-tectonic-${{ hashFiles('presentation/*.tex') }}
          restore-keys: |
            ${{ runner.os }}-tectonic-

      - name: Setup Tectonic
        uses: wtfjoke/setup-tectonic@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install python-pptx pillow google-api-python-client google-auth

      - name: Compile LaTeX to PDF
        working-directory: presentation
        run: |
          echo "Compiling submission.tex with Tectonic..."
          tectonic submission.tex
          ls -lh submission.pdf

      - name: Convert PDF to 16:9 PPTX
        run: |
          echo "Converting submission.pdf to submission.pptx..."
          python3 scripts/pdf_to_pptx.py presentation/submission.pdf -o presentation/submission.pptx --dpi 200
          ls -lh presentation/submission.pptx

      - name: Render Slide PNG Images
        run: |
          mkdir -p presentation/slides
          rm -f presentation/slides/*.png
          pdftoppm -png -r 200 presentation/submission.pdf presentation/slides/slide
          ls -lh presentation/slides

      - name: Commit & Push Slide Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add presentation/slides/*.png presentation/submission.pdf
          if git diff --staged --quiet; then
            echo "No slide assets changed."
          else
            git commit -m "Auto-update presentation build & slide assets [skip ci]"
            git push origin main
          fi

      - name: Upload Build Artifacts (PDF & PPTX)
        uses: actions/upload-artifact@v4
        with:
          name: presentation-builds
          path: |
            presentation/submission.pdf
            presentation/submission.pptx
          retention-days: 14

      - name: Sync to Google Slides Deck
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GDRIVE_PRESENTATION_ID: ${{ secrets.GDRIVE_PRESENTATION_ID }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "::error::GCP_SA_KEY secret is not configured in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$GDRIVE_PRESENTATION_ID" ]; then
            echo "::error::GDRIVE_PRESENTATION_ID secret is not configured in GitHub repository secrets."
            exit 1
          fi

          python3 scripts/upload_to_gslides.py \
            --presentation-id "$GDRIVE_PRESENTATION_ID" \
            --slides-dir presentation/slides \
            --base-url "https://raw.githubusercontent.com/${{ github.repository }}/main/presentation/slides" \
            --version-tag "${{ github.sha }}"
