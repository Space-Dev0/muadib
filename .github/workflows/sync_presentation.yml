name: Sync PowerPoint to Google Slides

on:
  push:
    branches: [main]
    paths:
      - 'presentation/powerpoint/which-exposure-matters-submission-guide.pptx'
      - 'scripts/upload_pptx_to_gslides.py'
      - 'scripts/upload_to_gslides.py'
      - '.github/workflows/sync_presentation.yml'
  workflow_dispatch:

concurrency:
  group: google-slides-submission
  cancel-in-progress: false

jobs:
  import-powerpoint:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Google API dependencies
        run: python -m pip install google-api-python-client google-auth
      - name: Upload and convert PowerPoint in place
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GDRIVE_PRESENTATION_ID: ${{ secrets.GDRIVE_PRESENTATION_ID }}
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY" || { echo '::error::GCP_SA_KEY is not configured.'; exit 1; }
          test -n "$GDRIVE_PRESENTATION_ID" || { echo '::error::GDRIVE_PRESENTATION_ID is not configured.'; exit 1; }
          python -m scripts.upload_pptx_to_gslides \
            --pptx presentation/powerpoint/which-exposure-matters-submission-guide.pptx \
            --expected-slides 12 --slide1-thumbnail "$RUNNER_TEMP/slide-01.png" \
            --slide3-thumbnail "$RUNNER_TEMP/slide-03.png" \
            --slide4-thumbnail "$RUNNER_TEMP/slide-04.png" \
            --slide9-thumbnail "$RUNNER_TEMP/slide-09.png"
      - name: Save Google Slides layout preview
        uses: actions/upload-artifact@v4
        with:
          name: google-slides-hypothesis-previews
          path: |
            ${{ runner.temp }}/slide-01.png
            ${{ runner.temp }}/slide-03.png
            ${{ runner.temp }}/slide-04.png
            ${{ runner.temp }}/slide-09.png
          retention-days: 7
