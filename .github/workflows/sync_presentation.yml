name: Sync PowerPoint to Google Slides

on:
  push:
    branches: [main]
    paths:
      - 'presentation/powerpoint/which-exposure-matters-submission-courses.pptx'
      - 'scripts/upload_to_gslides.py'
      - '.github/workflows/sync_presentation.yml'
  workflow_dispatch:

# Only one run may replace the target deck at a time, regardless of branch.
concurrency:
  group: google-slides-submission
  cancel-in-progress: false

jobs:
  render-and-sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering and Google API dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
          python -m pip install google-api-python-client google-auth
      - name: Render PowerPoint to slide images
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/presentation-pdf" presentation/slides
          libreoffice -env:UserInstallation="file://$RUNNER_TEMP/lo-profile" --headless \
            --convert-to pdf --outdir "$RUNNER_TEMP/presentation-pdf" \
            presentation/powerpoint/which-exposure-matters-submission-courses.pptx
          pdf="$RUNNER_TEMP/presentation-pdf/which-exposure-matters-submission-courses.pdf"
          test -s "$pdf"
          pages=$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" -ge 1
          rm -f presentation/slides/slide-*.png
          pdftoppm -png -r 200 "$pdf" presentation/slides/slide
          images=$(find presentation/slides -maxdepth 1 -name 'slide-*.png' | wc -l)
          test "$pages" -eq "$images"
      - name: Publish slide images
        id: publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo '::error::The default branch has advanced; rerun against its latest commit.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A presentation/slides
          if ! git diff --cached --quiet; then
            git commit -m 'docs: render PowerPoint slides for Google Slides'
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Verify public image URLs
        env:
          IMAGE_REVISION: ${{ steps.publish.outputs.revision }}
        run: |
          set -euo pipefail
          for image in presentation/slides/slide-*.png; do
            curl --fail --silent --show-error --retry 6 --retry-delay 5 --retry-all-errors \
              --output /dev/null "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$IMAGE_REVISION/$image"
          done
      - name: Upload source and rendered PDF
        uses: actions/upload-artifact@v4
        with:
          name: presentation-powerpoint-and-pdf
          path: |
            presentation/powerpoint/which-exposure-matters-submission-courses.pptx
            ${{ runner.temp }}/presentation-pdf/*.pdf
          retention-days: 14
      - name: Replace target Google Slides pages
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GDRIVE_PRESENTATION_ID: ${{ secrets.GDRIVE_PRESENTATION_ID }}
          IMAGE_REVISION: ${{ steps.publish.outputs.revision }}
        run: |
          set -euo pipefail
          test -n "$GCP_SA_KEY" || { echo '::error::GCP_SA_KEY is not configured.'; exit 1; }
          test -n "$GDRIVE_PRESENTATION_ID" || { echo '::error::GDRIVE_PRESENTATION_ID is not configured.'; exit 1; }
          python scripts/upload_to_gslides.py \
            --presentation-id "$GDRIVE_PRESENTATION_ID" \
            --slides-dir presentation/slides \
            --base-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$IMAGE_REVISION/presentation/slides" \
            --version-tag "$IMAGE_REVISION"
