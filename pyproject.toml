[project]
name = "which-exposure-matters"
version = "0.1.0"
description = "Controlled experiments on exposure in conditional diffusion models"
requires-python = ">=3.11"
dependencies = [
    "pillow",
    "scipy",
]

[project.optional-dependencies]
train = ["torch==2.9.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
